name: TableMacro
options:
  bundleIdPrefix: com.tablemacro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TableMacroCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  TableMacro:
    type: application
    platform: macOS
    sources:
      - path: Sources/TableMacroApp
      - path: Config/AppIcon.icns
        buildPhase: resources
    info:
      path: Config/TableMacro-Info.plist
      properties:
        CFBundleDisplayName: TableMacro
        CFBundleIconFile: AppIcon
        CFBundleName: TableMacro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMultipleInstancesProhibited: true
        NSMicrophoneUsageDescription: TableMacro listens for desk taps locally. Audio is discarded unless you explicitly enable debug recording.
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
    entitlements:
      path: Config/TableMacro.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    dependencies:
      - target: TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.app
        PRODUCT_NAME: TableMacro
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
  TableMacroCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TableMacroCoreTests
    dependencies:
      - target: TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroCoreTests
        GENERATE_INFOPLIST_FILE: YES
  TableMacroAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TableMacroAppTests
      - path: Sources/TableMacroApp/AppSection.swift
      - path: Sources/TableMacroApp/GuidedNavigationGate.swift
      - path: Sources/TableMacroApp/SensingStrategyResolver.swift
    dependencies:
      - target: TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroAppTests
        GENERATE_INFOPLIST_FILE: YES
  TableMacroSoak:
    type: tool
    platform: macOS
    sources:
      - path: Sources/TableMacroSoak
    dependencies:
      - target: TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroSoak
        GENERATE_INFOPLIST_FILE: YES
  TableMacroReplaySupport:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TableMacroReplaySupport
    dependencies:
      - target: TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroReplaySupport
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  TableMacroReplay:
    type: tool
    platform: macOS
    sources:
      - path: Sources/TableMacroReplay
    dependencies:
      - target: TableMacroCore
      - target: TableMacroReplaySupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroReplay
        GENERATE_INFOPLIST_FILE: YES
  TableMacroReplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TableMacroReplayTests
    dependencies:
      - target: TableMacroReplaySupport
      - target: TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroReplayTests
        GENERATE_INFOPLIST_FILE: YES
  TableMacroRouteCheck:
    type: tool
    platform: macOS
    sources:
      - path: Sources/TableMacroRouteCheck
      - path: Sources/TableMacroApp/SystemAudioRoute.swift
    dependencies:
      - target: TableMacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablemacro.TableMacroRouteCheck
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TableMacro:
    build:
      targets:
        TableMacro: all
        TableMacroCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TableMacroCoreTests
        - TableMacroAppTests
  TableMacroSoak:
    build:
      targets:
        TableMacroSoak: all
    run:
      config: Release
  TableMacroReplay:
    build:
      targets:
        TableMacroReplay: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - TableMacroReplayTests
  TableMacroRouteCheck:
    build:
      targets:
        TableMacroRouteCheck: all
    run:
      config: Debug
